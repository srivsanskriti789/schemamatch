services:
  - type: web
    name: schemamatch-api
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: FRONTEND_ORIGIN
        value: https://schemamatch.vercel.app
      - key: PYTHON_VERSION
        value: "3.11.6"
    plan: free
    healthCheckPath: /health
